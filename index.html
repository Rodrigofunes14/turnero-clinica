<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Espera - Turnero & Publicidad ART</title>
  <style>
    :root {
      --bg-main: #0d1117;
      --panel-bg: #161b22;
      --border-color: #30363d;
      --accent-blue: #0984e3;
      --accent-cyan: #00d2d3;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      overflow: hidden; 
    }
    
    .main-container { 
      display: flex; 
      flex: 1; 
      height: calc(100vh - 60px); 
    }

    /* Sección Izquierda: YouTube (68%) */
    .media-section { 
      flex: 6.8; 
      background-color: #000; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
    }
    .media-section #youtube-player { 
      width: 100%; 
      height: 100%; 
      pointer-events: none; 
    }

    /* Sección Derecha: Turnero (32%) */
    .turn-section { 
      flex: 3.2; 
      background-color: var(--panel-bg); 
      border-left: 4px solid var(--accent-cyan); 
      display: flex; 
      flex-direction: column; 
      padding: 20px; 
    }
    
    /* Cartel de Llamado Actual con Animación Flash */
    .current-call { 
      background: linear-gradient(135deg, #0984e3, #6c5ce7); 
      border-radius: 16px; 
      padding: 22px; 
      text-align: center; 
      margin-bottom: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.6); 
      transition: transform 0.2s ease;
    }
    
    .current-call.flash { 
      animation: flashAlert 0.6s ease infinite alternate; 
    }
    
    @keyframes flashAlert {
      0% { transform: scale(1); background: linear-gradient(135deg, #0984e3, #6c5ce7); filter: brightness(1); box-shadow: 0 0 10px rgba(0, 210, 211, 0.5); }
      100% { transform: scale(1.04); background: linear-gradient(135deg, #00b894, #e17055); filter: brightness(1.4); box-shadow: 0 0 35px #00d2d3; }
    }

    .current-call h2 { 
      font-size: 1.2rem; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      color: #dfe6e9; 
      margin-bottom: 5px; 
    }

    .patient-name { 
      font-size: 2.3rem; 
      font-weight: 800; 
      margin: 8px 0; 
      color: #fff; 
      word-break: break-word; 
      line-height: 1.2; 
    }

    .attention-badge { 
      font-size: 0.95rem; 
      background: rgba(0,0,0,0.3); 
      padding: 4px 12px; 
      border-radius: 20px; 
      display: inline-block; 
      margin-bottom: 10px; 
      color: #74b9ff; 
      font-weight: 600; 
    }

    .office-container {
      background: #ff7675; 
      padding: 12px; 
      border-radius: 10px; 
      display: block; 
      width: 100%; 
      color: #fff; 
      text-shadow: 0 1px 2px rgba(0,0,0,0.2); 
    }

    .office-number { 
      font-size: 1.6rem; 
      font-weight: bold; 
      display: block;
    }

    .doctor-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffeaa7;
      display: block;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Historial */
    .history-title { 
      font-size: 1.1rem; 
      color: var(--text-muted); 
      margin-bottom: 12px; 
      text-transform: uppercase; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 6px; 
      font-weight: bold; 
    }

    .history-list { 
      list-style: none; 
      overflow-y: auto; 
      flex: 1; 
      padding-right: 4px; 
    }
    
    .history-list::-webkit-scrollbar { width: 6px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    
    .history-item { 
      background: #21262d; 
      padding: 12px 14px; 
      border-radius: 8px; 
      margin-bottom: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-left: 3px solid var(--accent-blue); 
    }

    .history-item .h-patient { font-size: 1.05rem; font-weight: bold; color: var(--text-main); display: block; }
    .history-item .h-doctor { font-size: 0.85rem; color: #ffeaa7; display: block; font-weight: 600; }
    
    .history-item .h-office { 
      color: #58a6ff; 
      font-weight: bold; 
      font-size: 0.95rem; 
      background: rgba(88, 166, 255, 0.1); 
      padding: 6px 10px; 
      border-radius: 6px; 
      text-align: right;
    }

    /* Cinta inferior */
    .ticker-bar { 
      height: 60px; 
      background-color: #1f6feb; 
      color: white; 
      display: flex; 
      align-items: center; 
      overflow: hidden; 
      white-space: nowrap; 
      font-size: 1.4rem; 
      font-weight: bold; 
      box-shadow: 0 -4px 10px rgba(0,0,0,0.3); 
    }

    .ticker-content { 
      display: inline-block; 
      padding-left: 100%; 
      animation: marquee 30s linear infinite; 
    }

    @keyframes marquee { 
      0% { transform: translate(0, 0); } 
      100% { transform: translate(-100%, 0); } 
    }
  </style>
</head>
<body>

  <div class="main-container">
    <section class="media-section" aria-label="Reproductor multimedia">
      <div id="youtube-player"></div>
    </section>

    <section class="turn-section" aria-label="Panel de turnos">
      <div class="current-call" id="currentCallCard">
        <h2>Llamado Actual</h2>
        <div class="patient-name" id="currentPatient">Esperando...</div>
        <div class="attention-badge" id="currentAttentionType">--</div>
        <div class="office-container">
          <span class="office-number" id="currentOffice">CONSULTORIO --</span>
          <span class="doctor-name" id="currentDoctor">--</span>
        </div>
      </div>

      <h3 class="history-title">Últimos turnos llamados</h3>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </div>

  <footer class="ticker-bar">
    <div class="ticker-content">
      📢 Atención ART • Recuerde tener su DNI y Denuncia a mano • Mantenga el celular en silencio en la sala • Horario administrativo: 08:00 a 17:00 hs.
    </div>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer;
    const VIDEO_ID = 'cb12KmMMDJA';

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: VIDEO_ID,
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'rel': 0,
          'loop': 1,
          'playlist': VIDEO_ID,
          'enablejsapi': 1
        },
        events: {
          'onReady': (e) => {
            e.target.setVolume(70);
            e.target.playVideo();
          },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              e.target.setVolume(70);
            }
          }
        }
      });
    };
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCoMlaioT8CBGwKvPt86MGqOSdp1sapqdU",
      authDomain: "turnero-34d14.firebaseapp.com",
      databaseURL: "https://turnero-34d14-default-rtdb.firebaseio.com",
      projectId: "turnero-34d14",
      storageBucket: "turnero-34d14.firebasestorage.app",
      messagingSenderId: "244772189408",
      appId: "1:244772189408:web:cd444c47bf47e33c3c0c85"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let turnsHistory = [];
    let initialLoad = true;

    function playLongChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
        osc1.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); 
        gain1.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start();
        osc1.stop(audioCtx.currentTime + 1.2);

        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(783.99, audioCtx.currentTime); 
          osc2.frequency.exponentialRampToValueAtTime(587.33, audioCtx.currentTime + 0.4); 
          gain2.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 1.5);
        }, 400);

      } catch (e) {
        console.log("Error de audio", e);
      }
    }

    onValue(ref(db, 'currentTurn'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (initialLoad) {
        initialLoad = false;
        updateUI(data.patient, data.attentionType, data.office, data.doctor, false);
        return;
      }

      updateUI(data.patient, data.attentionType, data.office, data.doctor, true);
      playLongChime();
    });

    function updateUI(patient, attentionType, office, doctor, triggerAnimation) {
      document.getElementById('currentPatient').innerText = patient;
      document.getElementById('currentAttentionType').innerText = attentionType || 'Atención Médica';
      document.getElementById('currentOffice').innerText = office;
      document.getElementById('currentDoctor').innerText = doctor;

      if (triggerAnimation) {
        const card = document.getElementById('currentCallCard');
        card.classList.remove('flash');
        void card.offsetWidth; 
        card.classList.add('flash');

        setTimeout(() => {
          card.classList.remove('flash');
        }, 6000);
      }

      turnsHistory.unshift({ patient, attentionType, office, doctor });
      if (turnsHistory.length > 5) turnsHistory.pop();

      const list = document.getElementById('historyList');
      list.innerHTML = '';
      
      turnsHistory.slice(1).forEach(t => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <div>
            <span class="h-patient">${t.patient}</span>
            <span class="h-doctor">${t.doctor}</span>
          </div>
          <span class="h-office">${t.office}</span>
        `;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
