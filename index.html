<!-- API de YouTube (Volumen 70%) -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer;
    const VIDEO_ID = 'cb12KmMMDJA';

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: VIDEO_ID,
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'rel': 0,
          'loop': 1,
          'playlist': VIDEO_ID,
          'enablejsapi': 1
        },
        events: {
          'onReady': (e) => {
            e.target.setVolume(70);
            e.target.playVideo();
          },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              e.target.setVolume(70);
            }
          }
        }
      });
    };
  </script>

  <!-- Firebase y Lógica del Turnero con Activación Forzada de Voz -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCoMlaioT8CBGwKvPt86MGqOSdp1sapqdU",
      authDomain: "turnero-34d14.firebaseapp.com",
      databaseURL: "https://turnero-34d14-default-rtdb.firebaseio.com",
      projectId: "turnero-34d14",
      storageBucket: "turnero-34d14.firebasestorage.app",
      messagingSenderId: "244772189408",
      appId: "1:244772189408:web:cd444c47bf47e33c3c0c85"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let turnsHistory = [];
    let initialLoad = true;
    let audioUnlocked = false;

    // Forzar activación del sintetizador con el primer toque en pantalla
    window.addEventListener('click', () => {
      if (!audioUnlocked) {
        if ('speechSynthesis' in window) {
          const dummy = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(dummy);
        }
        audioUnlocked = true;
        console.log("Audio y voz desbloqueados por interacción del usuario.");
      }
    }, { once: true });

    // Alerta sonora (Campana Digital)
    function playChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); 

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch (e) {
        console.log("Error en audio WebAPI", e);
      }
    }

    // Síntesis de voz mejorada y forzada
    function speakTurn(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Cancela cualquier eco anterior
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-AR';
        utterance.rate = 0.90; // Ligeramente más pausado para que se entienda claro en la sala
        utterance.pitch = 1.0;

        // Intentar asignar una voz en español explícita si el sistema la tiene
        const voices = window.speechSynthesis.getVoices();
        const spanishVoice = voices.find(v => v.lang.includes('es') || v.lang.includes('ES'));
        if (spanishVoice) {
          utterance.voice = spanishVoice;
        }

        window.speechSynthesis.speak(utterance);
      } else {
        console.log("Este navegador no soporta síntesis de voz.");
      }
    }

    // Escuchar turnos en tiempo real
    onValue(ref(db, 'currentTurn'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (initialLoad) {
        initialLoad = false;
        updateUI(data.patient, data.attentionType, data.office, false);
        return;
      }

      updateUI(data.patient, data.attentionType, data.office, true);
      playChime();
      
      // Damos un pequeño margen para que suene la campana y luego habla
      setTimeout(() => {
        speakTurn(`Atención. Paciente ${data.patient}. Pasar al consultorio ${data.office}`);
      }, 500);
    });

    function updateUI(patient, attentionType, office, triggerAnimation) {
      document.getElementById('currentPatient').innerText = patient;
      document.getElementById('currentAttentionType').innerText = attentionType || 'Atención Médica';
      document.getElementById('currentOffice').innerText = `CONSULTORIO ${office}`;

      if (triggerAnimation) {
        const card = document.getElementById('currentCallCard');
        card.classList.remove('pulse');
        void card.offsetWidth; 
        card.classList.add('pulse');
      }

      turnsHistory.unshift({ patient, attentionType, office });
      if (turnsHistory.length > 5) turnsHistory.pop();

      const list = document.getElementById('historyList');
      list.innerHTML = '';
      
      turnsHistory.slice(1).forEach(t => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <div>
            <span class="h-patient">${t.patient}</span>
            <span class="h-type">${t.attentionType || 'General'}</span>
          </div>
          <span class="h-office">Cons. ${t.office}</span>
        `;
        list.appendChild(li);
      });
    }
  </script>
