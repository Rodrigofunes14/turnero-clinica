<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TURNERO ART</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding: 30px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h2 { color: #2c3e50; margin-bottom: 25px; text-align: center; font-size: 1.6rem; border-bottom: 2px solid #0984e3; padding-bottom: 10px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #34495e; }
    input, select { width: 100%; padding: 12px; border: 2px solid #dfe6e9; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: #0984e3; outline: none; box-shadow: 0 0 5px rgba(9, 132, 227, 0.3); }
    button { width: 100%; padding: 16px; background-color: #00b894; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    button:hover { background-color: #00a884; }
    button:active { transform: scale(0.98); }
    .status-msg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 0.95rem; min-height: 24px; }
    .success { color: #00b894; }
    .error { color: #d63031; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Llamar Paciente (ART)</h2>
    <form id="turnForm">
      <div class="form-group">
        <label for="patient">Apellido y Nombre:</label>
        <input type="text" id="patient" placeholder="Ej: Contalba, Mauricio" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="attentionType">Tipo de Atención:</label>
        <select id="attentionType">
          <option value="Consultorio Médico">Consultorio Médico</option>
            </select>
      </div>

      <div class="form-group">
        <label for="office">Consultorio:</label>
        <select id="office" required>
          <option value="1">DR GATTI CONSULTORIO ART 1</option>
          <option value="2">DR PASCUTTINI CONSULTORIO ART 2</option>
          <option value="3">DR HERNANDEZ CONSULTORIO 8</option>
          <option value="4">DR CHAVARRI CONSULTORIO ART 1</option>
          <option value="5">DR HERMOSA CONSULTORIO ART 1</option>
          <option value="6">DR FIORENTINO CONSULTORIO ART 1</option>
          <option value="7">DR LEITON CONSULTORIO ART 1</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit">📢 LLAMAR A PANTALLA</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0jx2LYqsTv0P1W3E2bz2WdE8OtDXfLFQ",
      authDomain: "turnero-clinica-394eb.firebaseapp.com",
      databaseURL: "https://turnero-clinica-394eb-default-rtdb.firebaseio.com",
      projectId: "turnero-clinica-394eb",
      storageBucket: "turnero-clinica-394eb.firebasestorage.app",
      messagingSenderId: "757280888834",
      appId: "1:757280888834:web:4c95a56fde05de9024ef1b"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const form = document.getElementById('turnForm');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const patient = document.getElementById('patient').value.trim();
      const attentionType = document.getElementById('attentionType').value;
      const office = document.getElementById('office').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.innerText = "Enviando...";

      try {
        // Guardamos únicamente el turno actual (sin bases de datos históricas pesadas)
        await set(ref(database, 'currentTurn'), {
          patient,
          attentionType,
          office,
          timestamp: Date.now()
        });

        statusMsg.className = "status-msg success";
        statusMsg.innerText = "¡Turno enviado con éxito!";
        
        form.reset();
        document.getElementById('patient').focus();
        
        setTimeout(() => { statusMsg.innerText = ""; }, 3000);
      } catch (err) {
        statusMsg.className = "status-msg error";
        statusMsg.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "📢 LLAMAR A PANTALLA";
      }
    });
  </script>
</body>
</html>
