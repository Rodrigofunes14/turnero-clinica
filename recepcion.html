<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Recepción ART</title>
  <style>
    :root {
      --primary: #0984e3;
      --primary-hover: #0765b2;
      --success: #00b894;
      --success-hover: #009977;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #34495e;
      --border-color: #dfe6e9;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      margin: 0; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
    }

    .card { 
      background: var(--card-bg); 
      padding: 35px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 500px; 
    }

    h2 { 
      color: var(--text-main); 
      margin-top: 0;
      margin-bottom: 25px; 
      text-align: center; 
      font-size: 1.5rem; 
      border-bottom: 2px solid var(--primary); 
      padding-bottom: 12px; 
    }

    .form-group { margin-bottom: 20px; }

    label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 600; 
      color: var(--text-muted); 
      font-size: 0.95rem;
    }

    input, select { 
      width: 100%; 
      padding: 12px 15px; 
      border: 2px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 1rem; 
      transition: border-color 0.2s, box-shadow 0.2s; 
    }

    input:focus, select:focus { 
      border-color: var(--primary); 
      outline: none; 
      box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.15); 
    }

    button { 
      width: 100%; 
      padding: 15px; 
      background-color: var(--success); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background 0.2s, transform 0.1s; 
      margin-top: 10px;
    }

    button:hover { background-color: var(--success-hover); }
    button:active { transform: scale(0.98); }
    button:disabled { background-color: #b2bec3; cursor: not-allowed; }

    .status-msg { 
      margin-top: 18px; 
      text-align: center; 
      font-weight: bold; 
      font-size: 0.95rem; 
      min-height: 24px; 
    }
    .success-text { color: var(--success); }
    .error-text { color: #d63031; }
  </style>
</head>
<body>

  <main class="card">
    <h2>Llamar Paciente (ART)</h2>
    <form id="turnForm">
      <div class="form-group">
        <label for="patient">Paciente / Apellido y Nombre:</label>
        <input type="text" id="patient" placeholder="Ej: Pérez, Juan (Siniestro #45821)" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="attentionType">Motivo / Tipo de Atención:</label>
        <select id="attentionType">
          <option value="Control Evolutivo ART">Control Evolutivo ART</option>
          <option value="Primera Vez / Siniestro">Primera Vez / Siniestro</option>
          <option value="Alta Médica">Alta Médica</option>
          <option value="Junta Médica / Auditoría">Junta Médica / Auditoría</option>
          <option value="Curación / Estudio">Curación / Estudio</option>
        </select>
      </div>

      <div class="form-group">
        <label for="officeSelect">Médico y Consultorio:</label>
        <select id="officeSelect" required>
          <option value="" disabled selected>Seleccione profesional...</option>
          <option value="ART 1" data-office="CONSULTORIO ART 1" data-doctor="DR. GATTI">DR. GATTI - Consultorio ART 1</option>
          <option value="8" data-office="CONSULTORIO 8" data-doctor="DR. HERNANDEZ">DR. HERNANDEZ - Consultorio 8</option>
          <option value="ART 2" data-office="CONSULTORIO ART 2" data-doctor="DR. PASCUTTINI">DR. PASCUTTINI - Consultorio ART 2</option>
          <option value="ART 1" data-office="CONSULTORIO ART 1" data-doctor="DR. HERMOSA">DR. HERMOSA - Consultorio ART 1</option>
          <option value="ART 1" data-office="CONSULTORIO ART 1" data-doctor="DR. LEITON">DR. LEITON - Consultorio ART 1</option>
          <option value="ART 1" data-office="CONSULTORIO ART 1" data-doctor="DR. CHAVARRI">DR. CHAVARRI - Consultorio ART 1</option>
          <option value="ART 1" data-office="CONSULTORIO ART 1" data-doctor="DR. FIORENTINO">DR. FIORENTINO - Consultorio ART 1</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit">📢 LLAMAR A PANTALLA</button>
      <div id="statusMsg" class="status-msg" aria-live="polite"></div>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCoMlaioT8CBGwKvPt86MGqOSdp1sapqdU",
      authDomain: "turnero-34d14.firebaseapp.com",
      databaseURL: "https://turnero-34d14-default-rtdb.firebaseio.com",
      projectId: "turnero-34d14",
      storageBucket: "turnero-34d14.firebasestorage.app",
      messagingSenderId: "244772189408",
      appId: "1:244772189408:web:cd444c47bf47e33c3c0c85"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById('turnForm');
    const statusMsg = document.getElementById('statusMsg');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const patient = document.getElementById('patient').value.trim();
      const attentionType = document.getElementById('attentionType').value;
      
      const selectOffice = document.getElementById('officeSelect');
      const selectedOption = selectOffice.options[selectOffice.selectedIndex];
      
      const office = selectedOption.getAttribute('data-office');
      const doctor = selectedOption.getAttribute('data-doctor');

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Enviando...";

      try {
        await set(ref(db, 'currentTurn'), {
          patient,
          attentionType,
          office,
          doctor,
          timestamp: Date.now()
        });

        statusMsg.className = "status-msg success-text";
        statusMsg.innerText = "¡Turno enviado con éxito!";
        
        form.reset();
        document.getElementById('patient').focus();
      } catch (err) {
        statusMsg.className = "status-msg error-text";
        statusMsg.innerText = "Error: " + err.message;
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "📢 LLAMAR A PANTALLA";
        setTimeout(() => { statusMsg.innerText = ""; }, 3000);
      }
    });
  </script>
</body>
</html>
